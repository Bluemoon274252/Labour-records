<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blue Moon Labor Records</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#142033}header{background:#1769e0;color:white;padding:24px;border-radius:0 0 22px 22px}main{max-width:900px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.stat{background:white;padding:16px;border-radius:16px;margin:10px 0;box-shadow:0 4px 14px #0001}.stat b{font-size:24px;display:block}.toolbar{display:flex;gap:10px;margin:18px 0}input,button{padding:12px;border-radius:10px;border:1px solid #ccd5e2}input{flex:1}button{background:#1769e0;color:white;border:0;font-weight:bold}.employee{display:flex;justify-content:space-between}.badge{padding:6px 9px;border-radius:20px;background:#e8f7ee;color:#18834b;height:max-content}.soon{background:#fff2dc;color:#a85d00}.expired{background:#ffe7e7;color:#b42318}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column}}</style></head><body><header><h1>🌙 Blue Moon</h1><div>Labor Records</div></header><main><div class="stats"><div class="stat"><b id="total">0</b>Total Employees</div><div class="stat"><b id="active">0</b>Active</div><div class="stat"><b id="soon">0</b>Expiring Soon</div><div class="stat"><b id="expired">0</b>Expired</div></div><div class="toolbar"><input id="search" placeholder="Search employee, ID or passport"><button onclick="addEmployee()">＋ Add Employee</button></div><div id="list"></div></main><script>let a=JSON.parse(localStorage.bm||'[]');const q=id=>document.getElementById(id);function days(d){return d?Math.ceil((new Date(d)-new Date())/864e5):99999}function st(x){let d=Math.min(...[x.passport,x.eidExpiry,x.visa,x.mohre,x.insurance].filter(Boolean).map(days),99999);return d<0?['Expired','expired']:d<=30?['Expiring Soon','soon']:['Active','badge']}function render(){let s=q('search').value.toLowerCase(),b=a.filter(x=>(x.name+' '+x.empid+' '+x.passport).toLowerCase().includes(s));q('total').textContent=a.length;q('active').textContent=a.filter(x=>st(x)[0]=='Active').length;q('soon').textContent=a.filter(x=>st(x)[0]=='Expiring Soon').length;q('expired').textContent=a.filter(x=>st(x)[0]=='Expired').length;q('list').innerHTML=b.length?b.map(x=>`<div class=card><div class=employee><div><b>${x.name}</b><div>${x.profession||'No profession'} · ${x.nationality||''}</div><small>Employee ID: ${x.empid||'—'} · Passport: ${x.passport||'—'}</small></div><span class=${st(x)[1]}>${st(x)[0]}</span></div></div>`).join(''):'<div class=card>No employees yet.</div>'}function addEmployee(){let name=prompt('Full name');if(!name)return;let empid=prompt('Employee ID')||'',passport=prompt('Passport number')||'',profession=prompt('Profession')||'',nationality=prompt('Nationality')||'',visa=prompt('Visa expiry YYYY-MM-DD')||'',eidExpiry=prompt('Emirates ID expiry YYYY-MM-DD')||'',mohre=prompt('MOHRE work permit expiry YYYY-MM-DD')||'',insurance=prompt('Insurance expiry YYYY-MM-DD')||'';a.push({name,empid,passport,profession,nationality,visa,eidExpiry,mohre,insurance});localStorage.bm=JSON.stringify(a);render()}q('search').oninput=render;render();</script></body></html>
